[package]
name = "portal-clip"
version.workspace = true
edition.workspace = true
description = "Mac clipboard access: native NSPasteboard reads/writes (no osascript), concealed-type detection"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# Native pasteboard access (in-process — no osascript; DESIGN-clipsync §2.1)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSValue", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep", "NSGraphics"] }

[dev-dependencies]
