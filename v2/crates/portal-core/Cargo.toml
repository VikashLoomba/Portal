[package]
name = "portal-core"
version.workspace = true
edition.workspace = true
description = "Daemon core: multi-box supervisor, reconcile engine, port mapping, config, local API"

[dependencies]
portal-proto = { workspace = true, features = ["async"] }
portal-transport = { workspace = true }
portal-clip = { workspace = true }
portal-cred = { workspace = true }
portald = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ciborium = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
