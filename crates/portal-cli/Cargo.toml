[package]
name = "portal-cli"
version.workspace = true
edition.workspace = true
description = "Portal Rust application logic for the Swift host"
autobins = false

[dependencies]
portal-core = { workspace = true }
portal-client = { workspace = true }
portal-clip = { workspace = true }
portal-cred = { workspace = true }
portal-proto = { workspace = true }
portal-transport = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# In-process minisign verification for `portal upgrade` (no external
# minisign binary, no on-disk public key needed on user machines).
minisign-verify = "0.2"
# Deployment uses a same-directory tempfile for atomic rename and an advisory
# lock so concurrent install/upgrade commands cannot interleave.
tempfile = "3"
fs2 = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# The local-API subscription tests script the bootstrap's agent probe.
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Production Rust code only needs to terminate old app instances during an
# atomic update. The Swift host owns all presentation.
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }
